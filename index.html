    <script>
        const S_URL = "https://qkibavobmjqowhdmzkvi.supabase.co";
        const S_KEY = "sb_publishable_w2GSYOeWJY1FyERvGOurmw_RuYnEo_7";
        const _client = supabase.createClient(S_URL, S_KEY);

        let currentView = 'TCG News'; 
        let currentFranchise = 'all';
        let currentSearch = '';
        let currentEventFilter = 'All';
        let currentVendorFilter = 'All'; 
        let currentCalDate = new Date(); 
        
        let newsLayout = 'grid';
        let currentPage = 1;
        const ITEMS_PER_PAGE = 48; 
        
        let allData = [];
        let allEvents = [];
        let vendorBanners = [];
        let billboardData = [];
        let commonEvents = [];
        
        let currentSlide = 0;
        let slideInterval;

        function openPreviewModal(idx) {
            const item = allData.find(i => i._internalId === idx);
            if (!item) return;

            let rawTag = item.franchise ? item.franchise.split(',')[0].trim() : "NEW";
            const tag = rawTag.toLowerCase() === 'pokemon' ? 'Pokémon' : rawTag.toUpperCase();
            const displaySource = (item.source || 'UNKNOWN').replace('Telegram: ', '');
            const displayDate = new Date(item.published_date || item.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

            document.getElementById('preview-image').src = item.image_url || `https://placehold.co/600x400/f8fafc/94a3b8?text=${tag}`;
            document.getElementById('preview-tag').innerText = tag;
            document.getElementById('preview-date').innerText = displayDate;
            document.getElementById('preview-title').innerText = item.title || 'Untitled';
            document.getElementById('preview-source').innerText = displaySource;
            document.getElementById('preview-link').href = item.url;

            document.getElementById('preview-modal').classList.remove('hidden');
        }

        function closePreviewModal() {
            document.getElementById('preview-modal').classList.add('hidden');
        }

        function openReportModal(url, title) {
            document.getElementById('report-url').value = url;
            document.getElementById('report-title').value = title;
            document.getElementById('report-modal').classList.remove('hidden');
        }

        function closeReportModal() {
            document.getElementById('report-modal').classList.add('hidden');
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function updateStatus(text) {
            document.getElementById('mobile-status').innerText = text;
            document.getElementById('desktop-status').innerText = text;
        }

        async function fetchHub() {
            updateStatus('Syncing...');
            try {
                const [resVendors, resNews, resEvents, resCommonEvents] = await Promise.all([
                    _client.from('VENDORS').select('*'),
                    _client.from('TCG_NEWS').select('*').is('hidden', false).order('published_date', { ascending: false }),
                    _client.from('EVENTS').select('*').order('start_date', { ascending: true }),
                    _client.from('COMMON_EVENTS').select('*')
                ]);
                
                if (resVendors.data) vendorBanners = resVendors.data;
                if (resNews.data) allData = resNews.data.map((item, index) => ({ ...item, _internalId: index }));
                if (resEvents.data) allEvents = resEvents.data;
                if (resCommonEvents.data) commonEvents = resCommonEvents.data;

                updateStatus(`Updated ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`);
                renderBillboard();
                render();
            } catch (error) { updateStatus('Sync Failed'); console.error(error); }
        }

        function scrollToEvent(id) {
            const el = document.getElementById(id);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('ring-2', 'ring-indigo-500', 'shadow-lg');
                setTimeout(() => { el.classList.remove('ring-2', 'ring-indigo-500', 'shadow-lg'); }, 1500);
            }
        }

        function setNewsLayout(mode) {
            newsLayout = mode;
            document.getElementById('btn-list').className = mode === 'list' ? "px-3 py-1 bg-white shadow-sm rounded text-xs font-bold text-slate-700 transition-all" : "px-3 py-1 rounded text-xs font-bold text-slate-500 hover:text-slate-700 transition-all";
            document.getElementById('btn-grid').className = mode === 'grid' ? "px-3 py-1 bg-white shadow-sm rounded text-xs font-bold text-slate-700 transition-all" : "px-3 py-1 rounded text-xs font-bold text-slate-500 hover:text-slate-700 transition-all";
            render(false);
        }

        function renderBillboard() {
            const container = document.getElementById('billboard-container');
            const track = document.getElementById('billboard-track');
            
            billboardData = allData.filter(item => {
                if(!item.is_featured) return false;
                if(currentView === 'TCG News') return item.category === 'Global News' || item.category === 'Local News';
                return (item.category || '') === currentView;
            });
            
            if (currentView === 'Calendar' || currentView === 'About Us' || currentView === 'For Vendors' || currentSearch !== '' || billboardData.length === 0) {
                container.classList.add('hidden');
                clearInterval(slideInterval);
                return;
            }
            
            container.classList.remove('hidden');
            track.innerHTML = billboardData.map(post => {
                const isNews = currentView === 'TCG News';

        function nextSlide() {

        function render(resetScroll = true) {

            if (currentView === 'About Us') { container.innerHTML = ''; loadMoreBtn.classList.add('hidden'); renderAboutUs(container); if(resetScroll) document.getElementById('scroll-area').scrollTop = 0; return; }
            if (currentView === 'For Vendors') { container.innerHTML = ''; loadMoreBtn.classList.add('hidden'); renderVendorForm(container); if(resetScroll) document.getElementById('scroll-area').scrollTop = 0; return; }

            let filteredData = allData.filter(item => {

                    return franchises.includes(currentFranchise);
                });

            if (currentSearch) {
                filteredData = filteredData.filter(item => (item.title || '').toLowerCase().includes(currentSearch) || (item.source || '').toLowerCase().includes(currentSearch));

        function changeMonth(offset) { currentCalDate.setMonth(currentCalDate.getMonth() + offset); render(); }

        function renderCalendarGrid(container) {
            const year = currentCalDate.getFullYear(); const month = currentCalDate.getMonth(); const monthName = currentCalDate.toLocaleString('default', { month: 'long' });
            
            let html = `
                <div class="flex justify-between items-center mb-6 bg-white px-5 py-4 rounded-xl border border-slate-100 shadow-sm w-full">
                    <h2 class="text-lg font-bold text-slate-800">${monthName} ${year}</h2>
                    <div class="flex space-x-2">
                        <button onclick="changeMonth(-1)" class="px-3 py-1.5 bg-slate-50 hover:bg-slate-100 rounded-md text-slate-600 transition-colors"><</button>
                        <button onclick="currentCalDate = new Date(); render();" class="px-4 py-1.5 bg-slate-50 hover:bg-slate-100 text-xs font-semibold uppercase tracking-wider rounded-md text-slate-600 transition-colors hidden md:block">Today</button>
                        <button onclick="changeMonth(1)" class="px-3 py-1.5 bg-slate-50 hover:bg-slate-100 rounded-md text-slate-600 transition-colors">></button>
                    </div>
                </div>
                <div class="cal-grid shadow-[0_2px_8px_-2px_rgba(0,0,0,0.05)] mb-12 w-full">`;
            
            const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            const isMobile = window.innerWidth < 768;
            days.forEach(d => html += `<div class="cal-header">${isMobile ? d.charAt(0) : d}</div>`);

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const startingCell = firstDayOfMonth === 0 ? 6 : firstDayOfMonth - 1; 

            for (let i = 0; i < startingCell; i++) { html += `<div class="cal-cell bg-slate-50/50"></div>`; }

            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const cellDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                const dateClass = isToday ? 'cal-today shadow-md' : 'cal-date text-slate-700';

                let cellHtml = `<div class="cal-cell"><span class="${dateClass}">${day}</span><div class="mt-1 space-y-1.5">`;
                allEvents.forEach(ev => {
                    if(currentEventFilter !== 'All' && ev.event_type !== currentEventFilter) return;
                    if (cellDateStr >= ev.start_date && cellDateStr <= (ev.end_date || ev.start_date)) {
                        const colorClass = ev.event_type === 'Box Release' ? 'bg-rose-50 text-rose-700 hover:bg-rose-100' : 'bg-indigo-50 text-indigo-700 hover:bg-indigo-100';
                        
                        let iconUrl = ev.image_url;
                        if (!iconUrl) {
                            const matchedCommon = commonEvents.find(ce => (ev.title || '').toLowerCase().includes(ce.keyword.toLowerCase()));
                            if (matchedCommon) iconUrl = matchedCommon.logo_url;
                        }
                        
                        const iconHtml = iconUrl ? `<img src="${iconUrl}" class="w-6 h-6 rounded-md object-cover flex-shrink-0" onerror="this.style.display='none'">` : `<span class="flex-shrink-0 leading-none">●</span>`;
                        
                        cellHtml += `<a href="#event-${ev.id}" onclick="scrollToEvent('event-${ev.id}'); return false;" class="event-chip ${colorClass}" title="${ev.title}">
                            ${iconHtml}
                            <span class="truncate">${ev.title || 'Event'}</span>
                        </a>`;
                    }
                });
                cellHtml += `</div></div>`; html += cellHtml;
            }
            const totalCells = startingCell + daysInMonth;
            const remainingCells = (7 - (totalCells % 7)) % 7;
            for (let i = 0; i < remainingCells; i++) { html += `<div class="cal-cell bg-slate-50/50"></div>`; }
            container.innerHTML += html + `</div>`;
        }

        function renderEventList(container) {
            let filteredEvents = allEvents.filter(e => currentEventFilter === 'All' || e.event_type === currentEventFilter);
            filteredEvents = filteredEvents.filter(e => new Date(e.start_date).getMonth() === currentCalDate.getMonth());

                html += `
                    <div id="event-${ev.id}" class="bento-card flex flex-col md:flex-row hover:-translate-y-1 transition-all duration-300 rounded-lg">

                            <img src="${finalImgUrl}" onerror="this.onerror=null; this.src='${safeFallback}';" class="w-full h-full object-cover absolute inset-0">

                        <div class="md:w-3/5 flex flex-col bg-white border border-slate-100 rounded-r-lg">
                            <div class="flex border-b border-slate-100">
                                <div class="bg-slate-50 p-4 flex flex-col justify-center items-center min-w-[80px] border-r border-slate-100"><span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${sDate.toLocaleString('default', { month: 'short' })}</span><span class="text-2xl font-black text-slate-800">${dateDisplay}</span></div>
                                <div class="p-4 flex-grow flex items-center"><h3 class="text-sm font-semibold leading-snug text-slate-900">${ev.title}</h3></div>
                            </div>
                            <div class="p-4 text-xs text-slate-600 space-y-2 flex-grow">
                                <div class="flex items-center justify-between"><span class="flex items-center font-medium">🕒 ${ev.time_info || 'Time TBC'}</span><span class="text-[9px] font-bold uppercase px-2 py-1 rounded ${badgeColor} ml-2">${ev.event_type}</span></div>
                                <div class="flex items-start mt-2"><span class="mr-2">📍</span><div><span class="font-semibold text-slate-800">${ev.location || 'Location TBC'}</span><br><span class="text-[11px] text-slate-500">${ev.address || ''}</span></div></div>
                            </div>
                            <div class="px-4 py-3 bg-slate-50 border-t border-slate-100 rounded-br-lg">
                                <a href="${correctMapLink}" target="_blank" class="text-[10px] font-bold text-indigo-600 hover:text-indigo-800 uppercase tracking-widest flex items-center">🗺️ Open Map</a>
                            </div>
                        </div>
                    </div>`;
            });
            container.innerHTML += html + `</div></div>`;
        }

        function buildRowCard(item, layout = 'list') {
            const displayDate = new Date(item.published_date || item.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            
            let rawTag = item.franchise ? item.franchise.split(',')[0].trim() : "NEW";
            const tag = rawTag.toLowerCase() === 'pokemon' ? 'Pokémon' : rawTag.toUpperCase();
            
            const svgColor = tag === 'Pokémon' ? 'ef4444' : tag === 'ONE PIECE' ? '0ea5e9' : '94a3b8';
            const placeholder = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400' fill='%23f8fafc'><rect width='100%25' height='100%25'/><text x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='42' font-weight='900' fill='%23${svgColor}' opacity='0.4'>${tag}</text></svg>`;
            
            let titleHTML = item.title || 'Untitled';
            if(currentSearch) titleHTML = titleHTML.replace(new RegExp(currentSearch, "gi"), match => `<mark class="bg-yellow-200 text-slate-900 px-1 rounded">${match}</mark>`);

            const displaySource = (item.source || 'UNKNOWN').replace('Telegram: ', '');
            const displaySourceClean = displaySource.length > 20 ? displaySource.substring(0, 20) + '...' : displaySource;
            
            let locationTag = '';
            if (currentView === 'TCG News') {
                 const loc = item.category === 'Local News' ? 'LOCAL' : 'OVERSEAS';
                 const locStyle = item.category === 'Local News' ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700';
                 locationTag = `<span class="${locStyle} text-[9px] font-bold uppercase px-1.5 py-0.5 rounded leading-none shadow-sm">${loc}</span>`;
            }

            const safeTitle = titleHTML.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const reportBtn = `<button onclick="event.preventDefault(); event.stopPropagation(); openReportModal('${item.url}', '${safeTitle}');" class="text-slate-400 hover:text-red-500 transition-colors ml-auto flex items-center gap-1" title="Report Post"><svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"></path></svg></button>`;

            const isNews = currentView === 'TCG News';
            const wrapperStart = isNews ? `<a href="${item.url}" target="_blank" class="` : `<div onclick="openPreviewModal(${item._internalId})" class="cursor-pointer `;
            const wrapperEnd = isNews ? `</a>` : `</div>`;

            if (layout === 'grid') {
                return `
                    ${wrapperStart}bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-xl hover:-translate-y-1 hover:border-indigo-200 transition-all duration-300 flex flex-col h-full group">
                        <div class="relative w-full aspect-[4/3] overflow-hidden bg-slate-100">
                            <img src="${item.image_url || placeholder}" onerror="this.src='${placeholder}'" class="w-full h-full object-cover object-top group-hover:scale-105 transition-transform duration-700 ease-in-out">
                            <div class="absolute top-3 right-3 flex flex-col gap-2">
                                ${locationTag}
                            </div>
                        </div>
                        <div class="p-5 flex flex-col flex-grow">
                            <div class="mb-3">
                               <span class="text-[10px] font-black text-indigo-600 uppercase tracking-widest bg-indigo-50 border border-indigo-100 px-2.5 py-1 rounded-full">${tag}</span>
                            </div>
                            <h3 class="text-[15px] font-bold text-slate-800 line-clamp-3 mb-4 group-hover:text-indigo-600 transition-colors leading-relaxed">${titleHTML}</h3>
                            <div class="mt-auto flex items-center justify-between border-t border-slate-100 pt-4">
                                 <div class="flex flex-col">
                                     <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">Source</span>
                                     <span class="text-[11px] font-semibold text-slate-700 truncate max-w-[140px]">${displaySourceClean}</span>
                                 </div>
                                 <div class="flex items-center gap-3">
                                     <span class="text-[11px] font-medium text-slate-400">${displayDate}</span>
                                     ${reportBtn}
                                 </div>
                            </div>
                        </div>
                    ${wrapperEnd}`;
            }
            
            if (layout === 'compact') {
                return `
                    ${wrapperStart}flex gap-3 group p-2 hover:bg-slate-50 rounded-lg transition-colors border border-transparent hover:border-slate-100 relative">
                        <img src="${item.image_url || placeholder}" onerror="this.src='${placeholder}'" class="w-16 h-16 rounded object-cover border border-slate-100 flex-shrink-0">
                        <div class="flex flex-col flex-1 min-w-0 justify-center py-1">
                            <h4 class="text-[13px] font-bold text-slate-800 line-clamp-2 leading-snug group-hover:text-indigo-600 transition-colors pr-6">${titleHTML}</h4>
                            <div class="flex items-center gap-2 mt-auto pt-1">
                                <span class="text-[9px] font-bold text-indigo-500 uppercase tracking-widest">${tag}</span>
                                <span class="text-[10px] font-bold text-slate-500 ml-auto">${displayDate}</span>
                            </div>
                        </div>
                        <div class="absolute top-2 right-2">${reportBtn}</div>
                    ${wrapperEnd}`;
            }

            const imgClass = (item.category || '').includes('News') ? "news-img-row" : "object-contain";
            return `
                <article>
                    ${wrapperStart}row-card group flex w-full">
                        <img src="${item.image_url || placeholder}" onerror="this.src='${placeholder}'" class="row-card-img ${imgClass}" alt="${titleHTML}" loading="lazy">
                        <div class="flex flex-col justify-center flex-grow py-2 pr-2 min-w-0">
                            <div class="flex justify-between items-center mb-1.5">
                                <span class="text-[10px] font-bold text-indigo-500 uppercase tracking-widest">${tag}</span>
                                ${locationTag}
                            </div>
                            <h3 class="text-sm md:text-base font-bold leading-snug text-slate-800 group-hover:text-indigo-600 transition-colors line-clamp-2 mb-3 pr-4">${titleHTML}</h3>
                            <div class="flex items-center gap-3 mt-auto">
                                <span class="bg-slate-100 text-slate-600 text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded truncate max-w-[150px]">Source: ${displaySource}</span>
                                <span class="text-[11px] font-medium text-slate-400">${displayDate}</span>
                                ${reportBtn}
                            </div>
                        </div>
                    ${wrapperEnd}
                </article>`;
        }

        fetchHub();
        setInterval(fetchHub, 300000); 
		
    </script>
	<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
